<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hidden Pair</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one centred column. Four word "slips" in a 2x2 grid, chances as punched holes, guess bar below. */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#1B1F3A; --muted:#5D6385; --line:#CDD1E2;
  --accent:#E3A21A; --accent-ink:#2A1C00; --good:#1E8A5A; --bad:#C2413A; --hint:#8A90B0;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-tile:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12142A; --surface:#1C1F3B; --ink:#E9EBF7; --muted:#A1A6C8; --line:#2F3459;
  --accent:#F2B83A; --accent-ink:#2A1C00; --good:#3CC489; --bad:#F06B60; --hint:#7A80A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1C1F3B; --ink:#E9EBF7; --muted:#A1A6C8; --line:#2F3459;
  --accent:#F2B83A; --accent-ink:#2A1C00; --good:#3CC489; --bad:#F06B60; --hint:#7A80A8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(30px,8vw,44px)/1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rules{margin:0;color:var(--muted);max-width:60ch}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.category{font:600 18px/1.2 var(--f-display);margin-top:2px}
.category.locked{color:var(--hint)}
.chances{display:flex;gap:8px;align-items:center}
.hole{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);transition:background .25s}
.hole.used{background:transparent;border-color:var(--line)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px 12px;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.slip .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.tiles{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.tile{width:clamp(24px,6.6vw,34px);aspect-ratio:1/1.15;max-width:100%;border-radius:5px;display:grid;place-items:center;
  font:700 clamp(15px,4.4vw,20px)/1 var(--f-tile);border:2px solid var(--line);color:var(--ink);background:var(--bg)}
.given .tile{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.hint{color:var(--hint);border-style:dashed}
.found .tile{background:var(--good);border-color:var(--good);color:#fff}
.missed .tile{background:transparent;border-color:var(--bad);color:var(--bad)}
.found .tag{color:var(--good)} .missed .tag{color:var(--bad)}
.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:700 20px/1 var(--f-tile);letter-spacing:.18em;text-transform:uppercase;padding:14px;
  border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{font:600 16px/1 var(--f-body);border-radius:10px;border:0;padding:14px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.5em;margin:0;font-weight:600;text-align:center}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.info{color:var(--muted)}
.end{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.log{font-size:14px;color:var(--muted);text-align:center;margin:0}
.log b{font-family:var(--f-tile);color:var(--ink);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.hole{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Hidden <span>Pair</span></h1>
    <div class="stats" id="stats"></div>
  </header>
  <p class="rules">Four words share a link. Two are on the board. Find the other two in four guesses. Each miss uncovers a clue: first the link, then letters.</p>

  <div class="meta">
    <div>
      <div class="label" id="puzzleNo">Puzzle</div>
      <div class="category locked" id="category">Link hidden</div>
    </div>
    <div class="chances" id="chances" aria-label="Guesses left"></div>
  </div>

  <div class="board" id="board"></div>

  <form id="form" autocomplete="off">
    <input id="guess" maxlength="6" placeholder="Your guess" aria-label="Your guess" autocapitalize="characters" spellcheck="false">
    <button id="go" type="submit">Guess</button>
  </form>
  <p class="msg info" id="msg" role="status"></p>
  <p class="log" id="log"></p>
  <div class="end">
    <button class="ghost" id="next" type="button">Skip puzzle</button>
  </div>
</div>

<script>
const PUZZLES = [
  {cat:"Seasons", given:["SPRING","SUMMER"], hidden:["AUTUMN","WINTER"]},
  {cat:"Classical elements", given:["FIRE","WATER"], hidden:["EARTH","AIR"]},
  {cat:"Compass points", given:["NORTH","EAST"], hidden:["SOUTH","WEST"]},
  {cat:"The Beatles", given:["JOHN","PAUL"], hidden:["GEORGE","RINGO"]},
  {cat:"Golf scores", given:["EAGLE","PAR"], hidden:["BIRDIE","BOGEY"]},
  {cat:"Months of the year", given:["MARCH","MAY"], hidden:["JUNE","JULY"]},
  {cat:"Playing-card ranks", given:["KING","QUEEN"], hidden:["JACK","ACE"]},
  {cat:"Directions", given:["UP","LEFT"], hidden:["DOWN","RIGHT"]},
  {cat:"Arithmetic", given:["PLUS","MINUS"], hidden:["TIMES","DIVIDE"]},
  {cat:"States of matter", given:["SOLID","GAS"], hidden:["LIQUID","PLASMA"]},
  {cat:"The senses", given:["SIGHT","SMELL"], hidden:["TASTE","TOUCH"]},
  {cat:"Bed sizes", given:["TWIN","FULL"], hidden:["QUEEN","KING"]},
  {cat:"Baseball bases", given:["FIRST","THIRD"], hidden:["SECOND","HOME"]},
  {cat:"Counting-out rhyme", given:["EENY","MOE"], hidden:["MEENY","MINY"]},
  {cat:"Getting faster", given:["WALK","SPRINT"], hidden:["JOG","RUN"]},
  {cat:"It falls from the sky", given:["RAIN","SNOW"], hidden:["HAIL","SLEET"]},
  {cat:"Little Women sisters", given:["MEG","JO"], hidden:["BETH","AMY"]},
  {cat:"Basic tastes", given:["SWEET","UMAMI"], hidden:["SOUR","BITTER"]},
];
const MAX = 4;
const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem("hp-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("hp-"+k,JSON.stringify(v))}catch(e){}}
};
let stats = store.get("stats",{played:0,won:0,streak:0,best:0});
let order = store.get("order",null);
if(!Array.isArray(order) || order.length!==PUZZLES.length){order=shuffle([...PUZZLES.keys()]);store.set("order",order)}
let pos = store.get("pos",0) % PUZZLES.length;
let s; // round state

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const p = PUZZLES[order[pos]];
  s = {p, used:0, found:[false,false], misses:0, guesses:[], over:false};
  $("puzzleNo").textContent = `Puzzle ${pos+1} of ${PUZZLES.length}`;
  $("guess").value=""; $("guess").disabled=false; $("go").disabled=false;
  $("next").textContent="Skip puzzle";
  say("Type a word of up to 6 letters.","info");
  render(); $("guess").focus({preventScroll:true});
}

// Letters shown on an unsolved word, by number of misses so far.
function hintIdx(word){
  const idx=new Set();
  if(s.misses>=2) idx.add(0);
  if(s.misses>=3) idx.add(word.length-1);
  return idx;
}

function render(animate){
  const {p}=s;
  const cat=$("category");
  if(s.misses>=1||s.over){cat.textContent=p.cat;cat.classList.remove("locked")}
  else{cat.textContent="Link hidden";cat.classList.add("locked")}
  $("chances").innerHTML="";
  for(let i=0;i<MAX;i++){const h=document.createElement("span");h.className="hole"+(i<s.used?" used":"");$("chances").append(h)}
  $("chances").setAttribute("aria-label",`${MAX-s.used} guesses left`);

  const board=$("board"); board.innerHTML="";
  const slips=[...p.given.map(w=>({w,kind:"given"})), ...p.hidden.map((w,i)=>({w,kind:"hidden",i}))];
  slips.forEach(({w,kind,i})=>{
    const el=document.createElement("div");
    let tag="Given", show=true, cls="given";
    if(kind==="hidden"){
      if(s.found[i]){cls="found";tag="Found"}
      else if(s.over){cls="missed";tag="Answer"}
      else {cls="open";tag=`${w.length} letters`;show=false}
    }
    el.className="slip "+cls;
    if(animate===i && kind==="hidden") el.classList.add("pop");
    const hints = show?null:hintIdx(w);
    const tiles=[...w].map((ch,k)=>{
      if(show) return `<span class="tile">${ch}</span>`;
      if(hints.has(k)) return `<span class="tile hint">${ch}</span>`;
      return `<span class="tile"></span>`;
    }).join("");
    el.innerHTML=`<span class="tag">${tag}</span><div class="tiles" aria-label="${show?w:tag}">${tiles}</div>`;
    board.append(el);
  });
  $("log").innerHTML = s.guesses.length ? "Tried: "+s.guesses.map(g=>`<b>${g}</b>`).join(", ") : "";
  $("stats").textContent=`Won ${stats.won}/${stats.played} · Streak ${stats.streak} · Best ${stats.best}`;
}

function say(t,kind){const m=$("msg");m.textContent=t;m.className="msg "+kind}

function guess(raw){
  if(s.over) return;
  const g=raw.trim().toUpperCase();
  if(!/^[A-Z]{1,6}$/.test(g)){say("Use letters only, up to 6.","bad");shake();return}
  if(s.p.given.includes(g)){say(`${g} is already on the board.`,"info");return}
  if(s.guesses.includes(g)){say(`You already tried ${g}.`,"info");return}
  const open=s.p.hidden.map((w,i)=>s.found[i]?null:w);
  const lens=[...new Set(open.filter(Boolean).map(w=>w.length))];
  if(!lens.includes(g.length)){say(`The hidden word${lens.length>1?"s have":" has"} ${lens.join(" or ")} letters.`,"info");shake();return}

  s.used++; s.guesses.push(g); $("guess").value="";
  const hit=open.indexOf(g);
  if(hit>=0){
    s.found[hit]=true;
    if(s.found.every(Boolean)){finish(true);render(hit);return}
    say(`Yes, ${g}! One more to find.`,"good");
  } else {
    s.misses++;
    const clue = s.misses===1?"The link is now showing.":s.misses===2?"First letters are now showing.":"Last letters are now showing.";
    say(`${g} isn't one. ${s.used<MAX?clue:""}`,"bad"); shake();
  }
  if(s.used>=MAX){finish(false);render();return}
  render(hit>=0?hit:undefined);
}

function finish(won){
  s.over=true;
  stats.played++;
  if(won){stats.won++;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}
  else stats.streak=0;
  store.set("stats",stats);
  say(won?`Solved in ${s.used} guess${s.used>1?"es":""}.`:`Out of guesses. The link was ${s.p.cat.toLowerCase()}.`, won?"good":"bad");
  $("guess").disabled=true; $("go").disabled=true;
  $("next").textContent="Next puzzle"; $("next").focus({preventScroll:true});
}

function shake(){const f=$("form");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}

function next(){
  if(!s.over){stats.played++;stats.streak=0;store.set("stats",stats)}
  pos=(pos+1)%PUZZLES.length;
  if(pos===0){order=shuffle(order);store.set("order",order)}
  store.set("pos",pos); start();
}

$("form").addEventListener("submit",e=>{e.preventDefault();guess($("guess").value)});
$("next").addEventListener("click",next);
start();
</script>
</html>
